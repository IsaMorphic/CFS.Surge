# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs: 
  build:
    runs-on: ubuntu-latest    
    env:
      SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore all dependencies
      run: dotnet restore
    - name: Build CFS.Surge.Core
      run: dotnet build CFS.Surge.Core --no-restore --framework net10.0
    - name: Build CFS.Surge.ImageSharp
      run: dotnet build CFS.Surge.ImageSharp --no-restore --framework net10.0
